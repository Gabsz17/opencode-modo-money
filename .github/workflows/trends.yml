# .github/workflows/trends.yml — Daily trends fetch + validate + auto-commit
name: Daily Trends Cache

on:
  schedule:
    - cron: "0 6 * * *"  # 06:00 UTC diário
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch-trends:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: Configure git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run fetch-trends
        env:
          TIKTOK_CREATIVE_CENTER_KEY: ${{ secrets.TIKTOK_CREATIVE_CENTER_KEY }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
        run: npm run fetch-trends

      - name: Run validate
        run: npm run validate

      - name: Commit if cache changed
        run: |
          if ! git diff --quiet docs/dinheiro/trends-cache/; then
            git add docs/dinheiro/trends-cache/
            git commit -m "chore(trends): atualiza cache $(date +%F)"
            git push
          else
            echo "Cache inalterado — sem commit"
          fi